name: CI

on:
  push:
    branches: [production, stage]
  pull_request:
    branches: [production, stage]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lacrei-health-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        env:
          API_KEY: ""
          SECRET_KEY: "test-key"
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost"
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"
          poetry install
          poetry run pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Backup current version
        continue-on-error: true
        run: |
          docker pull $DOCKER_IMAGE:${{ github.ref_name }} || true
          docker tag $DOCKER_IMAGE:${{ github.ref_name }} $DOCKER_IMAGE:${{ github.ref_name }}-prev || true
          docker push $DOCKER_IMAGE:${{ github.ref_name }}-prev || true
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
            ${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
