version: '3.9'

services:
  db:
    image: postgres:15
    container_name: postgres-db
    env_file:
      - env/postgres.env
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network

  web:
    build: .
    env_file:
      - env/api.env
      - env/postgres.env
    environment:
      DATABASE_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db
    networks:
      - app-network

networks:
  app-network:

volumes:
  pg-data:
